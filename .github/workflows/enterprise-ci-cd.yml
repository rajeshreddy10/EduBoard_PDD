name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    name: Enterprise CI/CD Pipeline
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm run install:all

      - name: Run Global Code Quality & Linting
        run: npm run lint

      - name: Execute Automated Unit & Integration Tests
        run: npm test

      - name: Run Security SAST/DAST Audit (300 Checks)
        run: node scripts/run_security_suite.js

      - name: Build Web Application for Static Export
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/out'

      - name: Deploy Web Application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
