version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile.backend
    container_name: eduboard-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-eduboard-ai}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - eduboard_exports:/app/exports
      - eduboard_data:/app/.data
    restart: unless-stopped
    networks:
      - eduboard-net

  frontend:
    build:
      context: ../..
      dockerfile: frontend/docker/Dockerfile.frontend
    container_name: eduboard-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eduboard-net

  nginx:
    image: nginx:alpine
    container_name: eduboard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - eduboard-net

volumes:
  eduboard_exports:
  eduboard_data:

networks:
  eduboard-net:
    driver: bridge
