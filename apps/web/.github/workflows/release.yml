name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate PWA assets
        run: npx pwa-asset-generator public/icon.svg public/icons/ --background "#0a0a0f" --padding "20%" --splash-only false

      - name: Build Android package with Bubblewrap
        run: |
          npx @bubblewrap/cli init --manifest public/manifest.json
          npx @bubblewrap/cli build
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android.keystore
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore android.keystore \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            app-release-unsigned.apk smartboard
          $ANDROID_HOME/build-tools/*/zipalign -v 4 \
            app-release-unsigned.apk smartboard-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: smartboard-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app-release-bundle.aab

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smartboard-release.apk
            app-release-bundle.aab

  build-windows:
    name: Build Windows MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Convert to PWA and package
        run: |
          npm install -g @pwabuilder/cli
          npx pwabuilder package -t windows -p msix

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: SmartBoard*.msix

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: SmartBoard*.msix

  build-pwa:
    name: Build PWA Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Export static PWA
        run: npm run build

      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: out/
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/

  generate-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "template": "# Changelog\n\n$UNCATEGORIZED",
              "categories": [
                {"title": "## Features", "labels": ["feature", "enhancement"]},
                {"title": "## Bug Fixes", "labels": ["bug", "fix"]},
                {"title": "## Documentation", "labels": ["documentation"]},
                {"title": "## Maintenance", "labels": ["chore", "refactor", "dependencies"]}
              ],
              "label_extractor": [
                {"pattern": "(.+)", "target": "$1"}
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
